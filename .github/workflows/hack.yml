name: Oxide package metadata audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxide-package-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit APK and split package contents
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APK_DRIVE_ID: 1-49gBaLpzZINdeyxDz0Rs8VeO11gZaYV
      LIBIL2CPP_DRIVE_ID: 1sC1OTMgJeHJjxrN6k_uGWdQ_8hiQhPxf
      SPLIT_APK_DRIVE_ID: 1mSvcq6EQ7OruB-kAzRXdhverIF51P8I_

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip file binutils python3-pip
          python3 -m pip install --user --break-system-packages gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download supplied package files
        run: |
          set -euo pipefail
          mkdir -p audit
          gdown "$APK_DRIVE_ID" --output base.apk
          gdown "$SPLIT_APK_DRIVE_ID" --output split.apk
          gdown "$LIBIL2CPP_DRIVE_ID" --output libil2cpp.so
          for f in base.apk split.apk; do
            test -s "$f"
            if ! unzip -tq "$f"; then
              echo "::error::$f is not a valid APK/ZIP archive"
              exit 1
            fi
          done
          file libil2cpp.so | tee audit/native-library.txt
          readelf -h libil2cpp.so | tee -a audit/native-library.txt
          readelf -h libil2cpp.so | grep -q 'AArch64'

      - name: Inventory package contents
        run: |
          set -euo pipefail
          {
            echo "APK package inventory"
            for f in base.apk split.apk; do
              echo
              echo "===== $f ====="
              unzip -Z1 "$f" | sort
            done
          } > audit/package-entries.txt

          {
            echo "Metadata filename matches"
            for f in base.apk split.apk; do
              echo
              echo "===== $f ====="
              unzip -Z1 "$f" | grep -Ei 'global-metadata|metadata|\.obb$' || true
            done
          } > audit/metadata-candidates.txt

          cat audit/metadata-candidates.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-package-audit
          path: audit/
          if-no-files-found: warn
          retention-days: 7
