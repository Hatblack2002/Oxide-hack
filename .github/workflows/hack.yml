name: Oxide IL2CPP analysis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxide-il2cpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dump:
    name: Extract metadata and run Il2CppDumper
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APK_DRIVE_ID: 1-49gBaLpzZINdeyxDz0Rs8VeO11gZaYV
      LIBIL2CPP_DRIVE_ID: 1sC1OTMgJeHJjxrN6k_uGWdQ_8hiQhPxf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip file binutils python3-pip
          python3 -m pip install --user --break-system-packages gdown
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download APK and libil2cpp.so from Google Drive
        run: |
          set -euo pipefail

          gdown "$APK_DRIVE_ID" --output assets.apk
          test -s assets.apk
          unzip -tq assets.apk
          echo "APK downloaded and ZIP integrity verified."
          ls -lh assets.apk

          gdown "$LIBIL2CPP_DRIVE_ID" --output libil2cpp.so
          test -s libil2cpp.so
          file libil2cpp.so

          if ! readelf -h libil2cpp.so | grep -q 'AArch64'; then
            echo "::error::Downloaded libil2cpp.so is not an AArch64 ELF library."
            readelf -h libil2cpp.so || true
            exit 1
          fi

          echo "libil2cpp.so downloaded and verified as AArch64 ELF."
          ls -lh libil2cpp.so

      - name: Extract global-metadata.dat and prepare inputs
        run: |
          set -euo pipefail
          mkdir -p input output

          cp libil2cpp.so input/libil2cpp.so
          test -s input/libil2cpp.so

          METADATA_PATH="$(unzip -Z1 assets.apk | awk 'tolower($0) ~ /(^|\/)global-metadata\.dat$/ { print; exit }')"
          if [ -z "$METADATA_PATH" ]; then
            echo "::error::The supplied APK does not contain global-metadata.dat."
            echo "APK entries containing 'metadata' (if any):"
            unzip -Z1 assets.apk | grep -i metadata || true
            exit 1
          fi

          unzip -p assets.apk "$METADATA_PATH" > input/global-metadata.dat
          test -s input/global-metadata.dat
          METADATA_SIZE="$(stat -c%s input/global-metadata.dat)"
          if [ "$METADATA_SIZE" -lt 16 ]; then
            echo "::error::Extracted global-metadata.dat is too small ($METADATA_SIZE bytes)."
            exit 1
          fi

          echo "Extracted metadata from: $METADATA_PATH"
          ls -lh input/

      - name: Download Il2CppDumper
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-net6-v6.7.40.zip" \
            --output il2cppdumper.zip
          unzip -tq il2cppdumper.zip
          mkdir -p tools/Il2CppDumper
          unzip -q il2cppdumper.zip -d tools/Il2CppDumper

          DUMPER_DLL="$(find tools/Il2CppDumper -type f -name 'Il2CppDumper.dll' -print -quit)"
          if [ -z "$DUMPER_DLL" ]; then
            echo "::error::Il2CppDumper.dll was not found in the downloaded release."
            exit 1
          fi
          echo "DUMPER_DLL=$DUMPER_DLL" >> "$GITHUB_ENV"

      - name: Run Il2CppDumper
        run: |
          set -euo pipefail
          dotnet "$DUMPER_DLL" \
            "$PWD/input/libil2cpp.so" \
            "$PWD/input/global-metadata.dat" \
            "$PWD/output"

          if [ -z "$(find output -type f -print -quit)" ]; then
            echo "::error::Il2CppDumper completed without producing output files."
            exit 1
          fi

          echo "Generated files:"
          find output -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload Il2CppDumper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxide-il2cpp-dump
          path: |
            output/
            input/
          if-no-files-found: warn
          retention-days: 7
